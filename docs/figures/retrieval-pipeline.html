<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retrieval pipeline: what is measured, and where</title>
<style>
  :root{
    --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0; --accent:#eb6c36;
    --accent-tint:rgba(235,108,54,0.08);
  }
  html,body{margin:0;background:var(--paper);}
  body{padding:40px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);}
  figure{margin:0;max-width:1000px;}
  figcaption{margin-top:18px;font-size:13px;line-height:1.55;color:var(--muted);max-width:78ch;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
</style>
</head>
<body>
<figure>
<!-- diagram-meta {"sources":["scripts/build_index.py","scripts/eval_power.py","scripts/eval_diacritics.py","Makefile"]} -->
<svg viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Retrieval pipeline: two offline indexes, three online probes, one measured answer</title>
  <desc id="d">Offline lane builds a 900-item catalogue into two vector columns (accented and unaccented) plus a lexical index inside pgvector. Online lane sends a query to the lexical probe and to both vector probes, fuses with RRF, optionally reranks, and returns ten results. A measurement panel to the right holds the 250-query benchmark and its bootstrap confidence interval.</desc>
  <rect x="0" y="0" width="960" height="470" fill="var(--paper)"/>

  <text x="24" y="36" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">OFFLINE — BUILD</text>
  <line x1="24" y1="48" x2="700" y2="48" stroke="var(--rule)" stroke-width="1"/>

  <rect x="24" y="70" width="188" height="70" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="40" y="96" font-size="13" font-weight="600">900 catalogue items</text>
  <text x="40" y="116" font-size="11.5" fill="var(--muted)">13 categories, 12 brands</text>
  <text x="40" y="131" font-size="11.5" fill="var(--muted)">Vietnamese, with diacritics</text>

  <rect x="248" y="70" width="196" height="70" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="264" y="96" font-size="13" font-weight="600">Embed, same model</text>
  <text x="264" y="116" font-size="11.5" fill="var(--muted)">stored as float32 or fp16</text>
  <text x="264" y="131" font-size="11.5" fill="var(--muted)">one pass per column</text>

  <rect x="480" y="62" width="212" height="120" rx="3" fill="var(--accent-tint)" stroke="var(--accent)"/>
  <text x="496" y="88" font-size="13" font-weight="600">PostgreSQL + pgvector</text>
  <text x="496" y="109" font-size="11.5" fill="var(--muted)">HNSW · embedding</text>
  <text x="496" y="126" font-size="11.5" fill="var(--muted)">HNSW · embedding_unaccent</text>
  <text x="496" y="143" font-size="11.5" fill="var(--muted)">GIN · tsvector (lexical)</text>
  <text x="496" y="166" font-size="11" fill="var(--soft)" class="mono">2.6 KB/row per vector (fp16)</text>

  <line x1="212" y1="105" x2="244" y2="105" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="444" y1="105" x2="476" y2="105" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="24" y="228" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">ONLINE — ONE QUERY</text>
  <line x1="24" y1="240" x2="700" y2="240" stroke="var(--rule)" stroke-width="1"/>

  <rect x="24" y="262" width="188" height="70" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="40" y="288" font-size="13" font-weight="600">query</text>
  <text x="40" y="308" font-size="11.5" fill="var(--muted)">typed with or without</text>
  <text x="40" y="323" font-size="11.5" fill="var(--muted)">diacritics — no detection</text>

  <rect x="248" y="252" width="196" height="90" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="264" y="276" font-size="12.5" font-weight="600">three probes, one pass</text>
  <text x="264" y="296" font-size="11.5" fill="var(--muted)">lexical · vector accented</text>
  <text x="264" y="312" font-size="11.5" fill="var(--muted)">vector unaccented</text>
  <text x="264" y="330" font-size="11" fill="var(--soft)" class="mono">5.4 ms (one) · 18.8 ms (two)</text>

  <rect x="480" y="252" width="212" height="90" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="496" y="276" font-size="12.5" font-weight="600">RRF fuse, then rerank</text>
  <text x="496" y="296" font-size="11.5" fill="var(--muted)">rerank is optional:</text>
  <text x="496" y="312" font-size="11.5" fill="var(--muted)">+0.10 hit for +774 ms</text>
  <text x="496" y="330" font-size="11" fill="var(--soft)" class="mono">fast path skips it</text>

  <rect x="480" y="366" width="212" height="52" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
  <text x="496" y="390" font-size="12.5" font-weight="600">top 10 with source</text>
  <text x="496" y="407" font-size="11.5" fill="var(--muted)">answered in tens of ms</text>

  <line x1="212" y1="297" x2="244" y2="297" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="444" y1="297" x2="476" y2="297" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="586" y1="342" x2="586" y2="362" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="586" y1="182" x2="586" y2="248" stroke="var(--rule-solid)" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>

  <text x="736" y="36" font-size="12" letter-spacing="0.09em" fill="var(--soft)" class="mono">MEASUREMENT</text>
  <line x1="736" y1="48" x2="936" y2="48" stroke="var(--rule)" stroke-width="1"/>
  <text x="736" y="80" font-size="12.5" font-weight="600">250 queries</text>
  <text x="736" y="98" font-size="11.5" fill="var(--muted)">gold from attributes,</text>
  <text x="736" y="114" font-size="11.5" fill="var(--muted)">never from a model</text>
  <text x="736" y="146" font-size="12.5" font-weight="600">4 slices</text>
  <text x="736" y="164" font-size="11.5" fill="var(--muted)">plain · nodauc</text>
  <text x="736" y="180" font-size="11.5" fill="var(--muted)">verbose · brand</text>
  <text x="736" y="212" font-size="12.5" font-weight="600">bootstrap CI</text>
  <text x="736" y="230" font-size="11.5" fill="var(--muted)">10 000 resamples,</text>
  <text x="736" y="246" font-size="11.5" fill="var(--muted)">paired against baseline</text>
  <text x="736" y="278" font-size="11" fill="var(--soft)" class="mono">40 queries: no verdict</text>
  <text x="736" y="294" font-size="11" fill="var(--soft)" class="mono">250 queries: verdict</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
</svg>
<figcaption><strong>Figure 1.</strong> Offline builds two vector columns from the same model plus a lexical index; online probes all three in one pass, fuses with RRF, and reranks only where the latency budget allows. The panel on the right is the reason the numbers in this repository can be trusted at all: the gold set comes from catalogue attributes, and every model comparison carries a confidence interval.</figcaption>
</figure>
</body>
</html>
